[package]
name = "deck-core"
version = "0.1.0"
edition = "2021"
description = "DreamTX presentation engine: model, DNAs, layout, export. One crate, native + wasm targets."

[lib]
name = "dreamtx"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

# wasm-pack: skip the wasm-opt post-pass. The workspace release profile
# strips symbols, and binaryen's wasm-opt cannot validate a fully stripped
# module ("Fatal: error validating input") — the wasm-ld output itself is
# spec-valid, so shipping it directly is safe (and the size win of strip
# outweighs wasm-opt's own optimization on this crate).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
