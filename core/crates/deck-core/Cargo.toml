[package]
name = "deck-core"
version = "0.1.0"
edition = "2021"
description = "DreamTX presentation engine: model, DNAs, layout, export. One crate, native + wasm targets."

[lib]
name = "dreamtx"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ttf-parser = "0.20"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
