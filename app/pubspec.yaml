name: dreamtx
description: DreamTX — the presentation app that lets YOUR AI build the deck (MCP, no API keys).
publish_to: "none"
version: 0.2.33+38

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  ffi: ^2.1.0
  path_provider: ^2.1.4
  # Hard pin, exact: path_provider_android >= 2.3.0 swapped its Android
  # implementation from the platform channel to the JNI (dart:ffi) bridge,
  # which throws java.lang.ClassNotFoundException on the affected device at
  # first use (dart-lang/native#3802). 2.2.23 is the last method-channel
  # implementation. CI verifies the *resolved* version from pubspec.lock,
  # not this declaration.
  path_provider_android: 2.2.23
  # Pinned exact, same contract as path_provider_android: resolution is a
  # contract, not a suggestion. 13.x is the federated line — the monolithic
  # 9/10.x needs win32 ^5, which conflicts with share_plus's win32 ^6 —
  # and the platform document browser behind the Files drawer's Open ·
  # Browse and the resource libraries' Add-asset flows.
  file_picker: 13.4.0
  share_plus: ^13.3.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
