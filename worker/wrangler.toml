name = "dreamtx-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Free-tier friendly: Durable Objects on SQLite storage.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "PairingRegistry"

[[durable_objects.bindings]]
name = "DECKS"
class_name = "DeckDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingRegistry", "DeckDO"]

# The Rust deck-core wasm module (built by `npm run build:wasm`, wasm-pack
# --target web into worker/wasm/) is imported directly by src/engine.ts and
# instantiated with a WebAssembly.Module — no network fetch at runtime.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
