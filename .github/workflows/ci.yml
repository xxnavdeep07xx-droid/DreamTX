name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-native:
    name: rust core (native tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --all

  core-wasm:
    name: rust core (wasm32 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build wasm
        run: cargo build --manifest-path core/Cargo.toml -p deck-core --target wasm32-unknown-unknown --features wasm --release

  worker:
    name: worker typecheck + mcp flow (wasm engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      # The Worker runs the real Rust deck-core compiled to wasm; build it
      # before typecheck/tests so the import in src/engine.ts resolves.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:wasm
      # Diagnostic: the pkg layout lands in the logs — if the glue names
      # ever drift (crate rename, wasm-pack change), this is where it shows.
      - run: ls -la wasm
      - run: npx tsc --noEmit
      # End-to-end MCP flow against a local Worker (wrangler dev): pairing,
      # handshake, deck mutation through the wasm engine, app-visible update.
      - run: node --test test/

  app-analyze:
    name: flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Same pinned toolchain as the APK workflow — analyze/test results must
      # describe the exact build that ships.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      # The committed lock governs resolution; pub get must not drift it.
      - name: Enforce committed dependency lock
        run: git diff --exit-code -- pubspec.lock
      # Analyze/test failures must be legible WITHOUT log access (the logs
      # endpoint needs auth; annotations render on the job page for anyone).
      # Every issue line becomes a ::error:: annotation + the full output
      # lands in the step summary; the exit code still gates the job.
      - name: flutter analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ "$code" -ne 0 ]; then
            {
              echo "### flutter analyze"
              echo '```'
              tail -c 60000 analyze.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep ' • ' analyze.txt | head -50 | sed 's/^/::error::/'
          fi
          exit $code
      - name: flutter test
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          tail -n 120 test.txt
          if [ "$code" -ne 0 ]; then
            {
              echo "### flutter test"
              echo '```'
              tail -c 60000 test.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Failing-test lines first — deck-store Exception noise would
            # otherwise eat the head budget and hide the [E] names.
            {
              grep -E '\[E\]' test.txt | head -30
              grep -E 'Some tests failed|Failed to load|tests passed, [0-9]+ failed' test.txt | head -10
              grep -E 'Exception' test.txt | head -10
            } | sed 's/^/::error::/' | head -50
          fi
          exit $code
