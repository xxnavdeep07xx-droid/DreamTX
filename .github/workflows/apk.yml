name: apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    name: android apk (rust + flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Java + Flutter --------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- Rust + Android NDK ----------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Locate NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/* | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            sdkmanager "ndk;26.1.10909125" >/dev/null
            NDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/26.1.10909125
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libdreamtx.so (3 ABIs)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs build --release --manifest-path core/Cargo.toml

      # ---- Generate platform folders, build APK ------------------------------
      - name: Flutter create (platform folders are CI-generated)
        working-directory: app
        run: |
          flutter create --org com.dreamtx --project-name dreamtx .
          flutter pub get
          flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamtx-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # ---- Release (tag pushes only) ----------------------------------------
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
