name: apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    name: android apk (rust + flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---- Java + Flutter --------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- Generate platform folders first (jniLibs target must exist) ----
      - name: Flutter create (platform folders are CI-generated)
        working-directory: app
        run: |
          flutter create --org com.dreamtx --project-name dreamtx .
          flutter pub get

      # ---- Host smoke gate: analyze + widget tests (no device needed) ----
      - name: Smoke tests (analyze + widget tests)
        working-directory: app
        run: |
          flutter analyze
          flutter test

      # ---- Rust + Android NDK ----------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Locate (or install) the NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;26.1.10909125" >/dev/null
            NDK="$SDK/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libdreamtx.so (3 ABIs)
        working-directory: core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../app/android/app/src/main/jniLibs build --release

      # ---- Release signing (keystore from repo secrets) -------------------
      - name: Decode release keystore + wire signing config
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > app/android/app/release-keystore.jks
            python3 .github/scripts/patch_android_signing.py app/android/app
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set; APK will be debug-signed."
          fi

      # ---- Build APK ----------------------------------------------------------
      - name: Flutter build apk
        working-directory: app
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamtx-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # ---- Release (tag pushes only) ----------------------------------------
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
